<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security headers (meta-supported subset; full set in public/_headers) -->
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=()" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="%VITE_GSC_VERIFICATION%" />

    <!-- ⚡ แก้ค่าเหล่านี้ที่ .env (VITE_SITE_URL / VITE_SITE_NAME / VITE_SITE_DESCRIPTION) -->
    <title>%VITE_SITE_NAME% — Beyond ur limits</title>
    <meta name="description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="author" content="HX DEV" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:title" content="%VITE_SITE_NAME% — Beyond ur limits" />
    <meta property="og:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta property="og:image" content="https://yhoerrkmntqzuwennzni.supabase.co/storage/v1/object/public/product-images/site/og-image.jpg" />
    <meta property="og:image:width" content="2000" />
    <meta property="og:image:height" content="500" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:alt" content="%VITE_SITE_NAME%" />
    <meta property="og:locale" content="%VITE_SITE_LOCALE%" />
    <meta property="og:site_name" content="%VITE_SITE_NAME%" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="%VITE_TWITTER_HANDLE%" />
    <meta name="twitter:title" content="%VITE_SITE_NAME% — Beyond ur limits" />
    <meta name="twitter:description" content="%VITE_SITE_DESCRIPTION%" />
    <meta name="twitter:image" content="https://yhoerrkmntqzuwennzni.supabase.co/storage/v1/object/public/product-images/site/og-image.jpg" />

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "%VITE_SITE_NAME%",
      "url": "%VITE_SITE_URL%",
      "description": "%VITE_SITE_DESCRIPTION%",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "%VITE_SITE_URL%/store?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;700&family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;700&family=Mitr:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&family=K2D:wght@400;500;600;700&family=Krub:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&family=Athiti:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@400;700&family=Press+Start+2P&family=Fira+Code:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.glass-card-hover, .hover-glow').forEach(card => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
          card.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
        });
      });
    </script>
  </body>
</html>
