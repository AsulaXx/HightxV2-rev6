<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Security headers (meta-supported subset; full set in public/_headers) -->
    <meta http-equiv="Content-Security-Policy" content="frame-ancestors 'none'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="permissions-policy" content="camera=(), microphone=(), geolocation=()" />
    <!-- ⚡ แก้ไขข้อมูลด้านล่างให้ตรงกับร้านของคุณ หรือแก้ที่ src/lib/tenantConfig.ts -->
    <title>My Store</title>
    <meta name="description" content="" />
    <meta name="author" content="" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#6366f1" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- Open Graph — แก้ให้ตรงกับร้านของคุณ -->
    <meta property="og:title" content="My Store" />
    <meta property="og:description" content="" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="th_TH" />
    <meta property="og:site_name" content="My Store" />

    <!-- Twitter — แก้ให้ตรงกับร้านของคุณ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="My Store" />
    <meta name="twitter:description" content="" />


    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;700&family=Prompt:wght@400;500;600;700&family=Sarabun:wght@400;700&family=Mitr:wght@400;500;600;700&family=Bai+Jamjuree:wght@400;500;600;700&family=K2D:wght@400;500;600;700&family=Krub:wght@400;500;600;700&family=Anuphan:wght@400;500;600;700&family=Athiti:wght@400;500;600;700&family=Sora:wght@400;500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@400;700&family=Press+Start+2P&family=Fira+Code:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      document.addEventListener('mousemove', (e) => {
        document.querySelectorAll('.glass-card-hover, .hover-glow').forEach(card => {
          const rect = card.getBoundingClientRect();
          card.style.setProperty('--mouse-x', (e.clientX - rect.left) + 'px');
          card.style.setProperty('--mouse-y', (e.clientY - rect.top) + 'px');
        });
      });
    </script>
  </body>
</html>
